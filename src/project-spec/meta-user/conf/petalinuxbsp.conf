#User Configuration

#OE_TERMINAL = "tmux"

# ===== WSL2 构建资源约束(请勿随意删除)=====
# 背景:本机 WSL2 为 12GB 内存 + 8GB swap + 12 核(见 %USERPROFILE%\.wslconfig,
# memory=12GB/processors=12/swap=8GB),nproc=12。并发取值与核数/内存对齐设为
# 12/12。若真遇到内存高峰(尤其同时跑其他程序、autoMemoryReclaim=gradual 归还
# 内存时)可用内存回落,可临时回退到 10/10 或 8/8。
# 附:曾因 4GB 内存 而压到 8/8——磁盘 100% 根因是内存小 + 并发高导致 page
# cache 反复回收(OOM/龟速),不仅是磁盘本身;内存调大后并发可放开。
BB_NUMBER_THREADS = "12"
PARALLEL_MAKE = "-j12"

# 编译任务用最低 I/O 优先级与较低 CPU 优先级,构建总时长不变,
# 但桌面/编辑器不再被拖死。若容器内没有 ionice/renice,bitbake 会忽略。
BB_TASK_IONICE_LEVEL = "2.7"
BB_TASK_NICE_LEVEL = "5"

# ===== 离线 sstate 镜像(请勿随意删除)=====
# 背景:offline sdk 包已解压到宿生 sdk/sstate,由 devops.sh 挂载为 /opt/xilinx/sstate,
# 内含 sstate_arm_2021.1(arm 架构,含 lockedsigs)。plnxtool.conf 会用一个空的
# SSTATE_MIRRORS 覆盖 PetaLinux 注入的离线源,导致离线 sstate 不命中(Found≈0,
# 全量本地编译)。这里用 _forcevariable 在 meta-user 层强制覆盖,重新指向离线包。
# PATH 是 bitbake 关键替换符,会被解析成 /opt/xilinx/sstate/arm/<hash>/...
SSTATE_MIRRORS_forcevariable = "file://.* file:///opt/xilinx/sstate/arm/PATH"

